<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objek 3D Peana</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5efff;
      color: #39285b;
      text-align: center;
    }

    header {
      padding: 24px 16px 8px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #716486;
    }

    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: #ffffff;
    }

    .info {
      padding: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>My 3D World</h1>
    <p>Objek 3D buatan Peana ✨</p>
  </header>

  <model-viewer
    src="./naiyyong.glb"
    alt="Model 3D Peana"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1">
  </model-viewer>

  <div class="info">
    <p>Geser untuk memutar objek 3D.</p>
    <p>Cubit layar untuk memperbesar atau memperkecil.</p>
  </div>
</body>
</html>
